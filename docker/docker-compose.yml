services:
    api:
        build: .
        container_name: agents-api
        ports:
            - "8000:8000"
        ipc: host
        env_file:
            - .env
        environment:
            # API Configuration
            - API_PORT=8000
            - API_HOST=0.0.0.0
            # Database (Updated to point to the internal 'db' service)
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/agents_db
            # Redis (use external Redis)
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_URL=${REDIS_URL}
            # AI Model API Keys
            - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
            - GEMINI_MODEL=${GEMINI_MODEL}
            # Optional Services
            - TAVILY_API_KEY=${TAVILY_API_KEY}
            - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
            - CORS_ORIGINS=${CORS_ORIGINS}
            - ALLOWED_IPS=${ALLOWED_IPS}
            # OpenTelemetry
            - OTEL_ENABLED=${OTEL_ENABLED:-false}
            - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-agentforge-api}
            - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-1.0.0}
            - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
            - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
        volumes:
            - ./uploads:/app/uploads
        healthcheck:
            test:
                ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped
