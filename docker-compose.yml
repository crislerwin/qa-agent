version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agents-postgres
    environment:
      POSTGRES_DB: agents_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agents-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: agents-api
    ports:
      - "8000:8000"
    ipc: host
    env_file:
      - .env
    environment:
      # Docker-specific overrides (these take precedence over .env file)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agents_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=8000
      - API_HOST=0.0.0.0
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
