version: "3.8"

services:
    api:
        build: .
        container_name: agents-api
        ports:
            - "8000:8000"
        ipc: host
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        environment:
            # API Configuration
            - API_PORT=8000
            - API_HOST=0.0.0.0
            # Database (Updated to point to the internal 'db' service)
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/agents_db
            # Redis (use external Redis)
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_URL=${REDIS_URL}
            # AI Model API Keys
            - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
            - GEMINI_MODEL=${GEMINI_MODEL}
            # Optional Services
            - TAVILY_API_KEY=${TAVILY_API_KEY}
            - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
            - CORS_ORIGINS=${CORS_ORIGINS}
            - ALLOWED_IPS=${ALLOWED_IPS}
            # OpenTelemetry
            - OTEL_ENABLED=${OTEL_ENABLED:-false}
            - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-agentforge-api}
            - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-1.0.0}
            - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
            - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
        volumes:
            - uploads_data:/usr/src/app/uploads
        healthcheck:
            test:
                ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped

    # --- PGVECTOR SERVICE (for development) ---
    db:
        image: pgvector/pgvector:pg16
        container_name: agents-db
        ports:
            - "5432:5432" # Expose to host if you want to connect via local psql/TablePlus
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=agents_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d agents_db"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    uploads_data:
    postgres_data: # Persist DB data
